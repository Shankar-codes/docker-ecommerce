services:
  mongodb:
    build: ./mongodb
    image: shankarntr/mongodb:v1
    container_name: mongodb
    volumes:
      - mongodb:/data/db
  catalogue:
    build: 
      context: ./catalogue
      dockerfile: Dockerfile
    image: shankarntr/catalogue:v1
    container_name: catalogue
    depends_on: 
    - mongodb
  redis:
    build: ./redis
    image: shankarntr/redis:v1
    container_name: redis
    volumes:
      - redis:/data
  mysql:
    build: ./mysql
    image: shankarntr/mysql:v1
    container_name: mysql
    volumes:
      - mysql:/var/lib/mysql
  rabbitmq:
    build: ./rabbitmq
    image: shankarntr/rabbitmq:v1
    container_name: rabbitmq
    volumes:
      - rabbitmq:/var/lib/rabbitmq
  user:
    build: ./user
    image: shankarntr/user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
  cart:
    build: ./cart
    image: shankarntr/cart:v1
    container_name: cart
    depends_on:
    - redis
    - catalogue
  shipping:
    build: ./shipping
    image: shankarntr/shipping:v1
    container_name: shipping
    depends_on:
    - cart
    - mysql
  payment:
    build: ./payment
    image: shankarntr/payment:v1
    container_name: payment
    depends_on:
    - cart
    - user
    - rabbitmq
  frontend:
    build: ./frontend
    image: shankarntr/frontend:v1
    container_name: frontend
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user
    - cart
    - shipping
    - payment

networks:
  default:
    driver: bridge
    name: ellamma
    external: false 

volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq: