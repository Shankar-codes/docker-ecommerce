services:
  mongodb:
    image: mongodb:v1
    container_name: mongodb
  catalogue:
    image: catalogue:v1
    container_name: catalogue
    depends_on: 
    - mongodb
  redis:
    image: redis:v1
    container_name: redis
  mysql:
    image: mysql:v1
    container_name: mysql
  rabbitmq:
    image: rabbitmq:v1
    container_name: rabbitmq
  user:
    image: user:v1
    container_name: user
    depends_on:
    - redis
    - mongodb
networks:
  default:
    driver: bridge
    name: ellamma
    external: false 